# Example Region config. Polygon is a rough box over the Great Belt (Storebaelt) and its approaches;
# refine against a real Scene footprint before the first production run.
region_id: great-belt
name: Great Belt
polygon:
  - [10.70, 55.00]
  - [11.30, 55.00]
  - [11.30, 55.70]
  - [10.70, 55.70]
  - [10.70, 55.00]
discovery:
  lookback_days: 7
detector:
  name: ca-cfar
  # v1: pfa 1e-6, min 3 px. v2 (chosen on three real scenes, see AGENTS.md): keeps 47 of 50 AIS-matched ships
  # and cuts unmatched open-water Detections by about 76 percent.
  # v3: v2 plus length_bias_m 20 (the cluster extent includes the point spread; against AIS length the raw
  # median absolute error fell from 22 to 15 m on 59 matched ships).
  # v4: v3 plus min_length_m 30 and min_confidence 0.7 (weak, short clusters are mostly false alarms: on 9 Scenes
  # 141 unmatched open-water Detections become 23, no AIS-matched ship of 30 m or longer is lost).
  # v5: v4 plus min_vh_contrast_db 12 (a ship is 12 dB or more above the VH sea around it; on 9 Scenes the
  # 23 unmatched open-water Detections of v4 become 7, one more matched ship is lost). VV and VH are both fetched.
  version: "5"
  params:
    guard_cells: 8
    background_cells: 24
    pfa: 1.0e-10
    min_cluster_pixels: 6
    length_bias_m: 20
    min_length_m: 30
    min_confidence: 0.7
    min_vh_contrast_db: 12
land_mask:
  near_shore_m: 300
  exclusion_m: 100 # ignore everything within 100 m of land (quays, piers, moored boats)
validation:
  gate_m: 200
  ais_margin_minutes: 30
  sea_level_height_m: 42  # geoid height above WGS 84 in the Great Belt; shifts ships toward the sensor in the image
retention:
  raster_days: 14
