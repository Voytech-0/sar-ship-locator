[project]
name = "sar-ship-locator"
version = "0.1.0"
description = "Automated Sentinel-1 ship detection pipeline with AIS validation"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "boto3>=1.35",
    "fastapi>=0.115",
    "httpx>=0.28",
    "numpy>=2.0",
    "prometheus-client>=0.21",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pyproj>=3.7",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "shapely>=2.0",
    "sqlalchemy>=2.0",
    "tifffile>=2024.9",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "mypy>=1.13",
    "moto[s3]>=5.0",
    "openapi-spec-validator>=0.7",
    "pillow>=11.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "schemathesis>=3.39",
    "testcontainers[postgres]>=4.9",
    "types-jsonschema",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline", "contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "contracts", "tests"]
